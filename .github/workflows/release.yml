name: Native Session Smoke Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Read project toolchain
        id: rust
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          channel = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={channel}\n')
          PYTHON
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          shared-key: native-session-smoke
      - name: Install frontend dependencies
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Build renderer
        run: pnpm build:renderer
      - name: Native backend preflight
        run: bash scripts/preflight.sh backend
      - name: Build native app
        run: >-
          pnpm tauri build --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'
      - name: Package app with provenance
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/CC Switch.app' native-app.zip
          git rev-parse HEAD > source-commit.txt
          shasum -a 256 native-app.zip > native-app.zip.sha256
          codesign --verify --deep --strict --verbose=2 'src-tauri/target/release/bundle/macos/CC Switch.app'
      - uses: actions/upload-artifact@v7
        with:
          name: cc-switch-native-arm64
          path: |
            native-app.zip
            native-app.zip.sha256
            source-commit.txt
          if-no-files-found: error
          retention-days: 7
